[project]
name = "artwall-hypr"
version = "0.1.0"
description = "Identify the active Hyprland wallpaper with local CLIP vector search and annotate it with a layer-shell overlay"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "pygobject>=3.56.3",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
artwall = "artwall.cli:main"
artwall-daemon = "artwall.daemon:main"
artwall-index = "artwall.ingest:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The CLIP model runs on CPU, so pull the CPU-only builds of torch and torchvision.
# The default wheels bundle the whole CUDA stack, which is roughly 2.5 GB of libraries
# this project never loads.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artwall"]
